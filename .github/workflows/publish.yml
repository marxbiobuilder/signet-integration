# Publishes to npm when a `vX.Y.Z` tag is pushed. Authenticates with npm
# trusted publishing (OIDC): no token, no OTP. The trusted publisher on
# npmjs.com must name this repository and this file (`publish.yml`).
#
# A prerelease (`vX.Y.Z-beta.0`) is published under the dist-tag named by its
# first prerelease identifier (`beta`), never under `latest`: an npm version
# cannot be unpublished and reused, so a prerelease that lands on `latest`
# reaches every plain `pnpm add` until another release moves `latest` back.
name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Refuse a tag that does not match package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match package.json version $version" >&2
            exit 1
          fi

      - name: Pick the npm dist-tag
        id: dist-tag
        run: |
          version="$(node -p "require('./package.json').version")"
          version="${version%%+*}"
          case "$version" in
            *-*)
              prerelease="${version#*-}"
              tag="${prerelease%%.*}"
              ;;
            *)
              tag=latest
              ;;
          esac
          # npm rejects a dist-tag that parses as a semver range (`0`), and a
          # prerelease identifier `latest` would defeat the point of this step.
          if [[ "$version" == *-* ]] && { [[ ! "$tag" =~ ^[A-Za-z][A-Za-z0-9-]*$ ]] || [ "$tag" = latest ]; }; then
            echo "prerelease $version has no usable dist-tag: identifier '$tag' must start with a letter and must not be 'latest'" >&2
            exit 1
          fi
          echo "publishing $version under dist-tag $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: npm publish --tag "$DIST_TAG"
