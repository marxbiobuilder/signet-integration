name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:cov

      - name: Build
        run: pnpm build

      - name: Check core package contents
        working-directory: packages/core
        run: npm pack --dry-run

      - name: Check Payload adapter package contents
        working-directory: packages/payload
        run: npm pack --dry-run

      - name: Show what a publish of @xignet/nest would ship
        working-directory: packages/nest
        run: npm pack --dry-run

  core-payload:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.23.4', '24', '26.13.1']
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9.1.1
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @xignet/core test
      - run: pnpm --filter @xignet/payload test

  client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.22.0', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 9.1.1
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check 'packages/client/**/*.{cts,json,mjs}'
      - run: pnpm --filter @xignet/client typecheck
      - run: pnpm --filter @xignet/client test
      - name: Check OAuth client package contents
        working-directory: packages/client
        run: npm pack --dry-run
